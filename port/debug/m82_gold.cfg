# M82: the gold-from-a-loot-bag repro.
#
# Same one-press-per-step shape as m81_loot.cfg, and for the same reason:
# `exec` runs a whole file inside one console drain, but travelling to a
# zone and handling a creature's death each need a *later* tick than the
# one that queues them.
#
# `bbrawler.s` is a top-level creature script, so it spawns in any zone,
# and its `SetLoot(300, "Loot_Gold6-10", 1, 2)` is a 1-in-2 drop of a bag
# whose only content is `Level.CreateEntity(52)` with a `Random(6, 10)`
# quantity -- i.e. gold and nothing else, which is what makes it the
# cleanest thing in the game to test this with.
#
#   copy this to autoexec.cfg (or `exec m82_gold` from the console), then:
#     F5  read the purse -- note the number
#     F6  spawn a batch of brawlers in front of you
#     F7  kill every live creature in the zone
#     F8  list what is left standing -- the drops are the `container` rows
#     F9  teleport next to the first of them
#    F10  read the purse again, after you have looted
#
# The spawn distance is 200 rather than the usual 400 because `Use` only
# reaches kInteractRange = 384 units and the bags land where the creatures
# died, so a 400-unit ring puts every one of them just out of reach.
#
# Then close the console, press Use to open the bag, and take the "N Gold
# Pieces" row. The purse moves by exactly N, the row does not appear in
# `inv`, and the log prints one `picked up N gold (total ...)` line.
#
# Before M82 the gold row went into the inventory as an ordinary carried
# object and the purse never moved. See docs/PORT_ROADMAP.md's M82 entry.
zone azra
bind f5 gold
bind f6 "spawn bbrawler 30 200"
bind f7 killall
bind f8 ents
bind f9 "tpe 1"
bind f10 gold
echo "m82_gold.cfg loaded -- F5 gold, F6 spawn, F7 killall, F8 ents, F9 tpe 1, F10 gold"
