# M95 live repro: the GameState odds and ends.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

zone azra

# ---------------------------------------------------------------------
# 1. DropGold -- the drop-gold menu that did nothing.
# ---------------------------------------------------------------------
# F5 gives 600 gold. Then use the real keys: **Tab** opens
# charactermanager.s with the gold row highlighted, **Enter** runs its
# `DropGold[]` (`Quit(); GetPlayer().OpenMenu("Menus\\DropGoldMenu")`),
# **D** steps the amount (at 600 gold: 25/50/100/500 -- numbers, not the
# "Medium Bow" this port used to draw) and **Enter** drops it.
bind f5 "call player SetGold 600"
#
# F6/F7 are the console shortcut for the same two handlers, but note the
# trap: F6 from the console leaves its Quit() for the host's next menu tick,
# which closes the drop screen it just opened. F7 still performs the drop on
# the menu object; it just is not on screen.
bind f6 "sk menu DropGold()"
bind f7 "sk menu comboBox.SetSelection(3); OnDropGold();"
#
# What to see: the console prints
#
#     [drop] Gold Pieces -> loot bag at (30218, 11776)
#
# and `stats` shows 100 gold. Walk onto the bag and Use it: the loot menu
# lists the 500, and taking it prints "picked up 500 gold (total 600)".
# The engine's gate is `amount < gold`, strictly: `call player SetGold 25`
# then `sk player DropGold(25)` does nothing at all.

# ---------------------------------------------------------------------
# 2. The cheat menu's three toggles.
# ---------------------------------------------------------------------
# F8: the ghost. Walk straight at a wall -- you pass through it, and at
# about half your normal speed (ghost_mode.h: the ghost arm never restores
# the velocity it quarters). `sk player SetGhost(false)` to stop.
bind f8 "sk player SetGhost(true)"
# F9: the coordinate readout, "x y" at (20, 20) over the HUD. A toggle.
bind f9 "sk player EnableCoords()"
bind f10 "where"

# ---------------------------------------------------------------------
# 3. VisitStore -- the God Vendor.
# ---------------------------------------------------------------------
# F11 opens the store screen on its buy page with 99 of every armour
# products.dat knows (89 lines), every one at 0 gold -- press **Tab** first,
# because a menu opened from the console during gameplay is not paused
# into (the real caller is cheatmenu.s, already a menu). The zeroed prices
# are written onto the shared catalogue, so an armourer met later in the
# session sells those pieces for nothing too -- as the engine does.
bind f11 "sk player VisitStore(6)"
bind f12 "stats"

# ---------------------------------------------------------------------
# 4. IsMenuActive.
# ---------------------------------------------------------------------
# `sk player IsMenuActive()` answers false in the 3D view and true with any
# screen up -- including after the back key resumes play without a script
# Quit(), which is the path that has to drop the flag by hand.
