# M100 live repro: a corpse decays five seconds after death, and its OnDecay
# runs then.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# Devron (monsters/devron.s) is one of the fifteen creatures with an OnDecay:
# it solves quest 33. `spawn` finds its entities.txt row (type 285), and
# `slay` kills it as the player's blow would. Leave freezeai
# off: it stops the whole creature tick, the decay clock included.
#
#   F5   spawn Devron
#   F6   slay devron -- it dies; `ents devron` still lists it for 5 seconds
#   F7   ents devron -- gone (destroyed) once the five seconds are up
#   F8   call player QuestSolved 33 -- false before the decay, true after
zone azra
set god 1
bind f5 "spawn monsters/devron.s 1 600"
bind f6 "slay devron"
bind f7 "ents devron"
bind f8 "call player QuestSolved 33"
echo "m100_hit_decay.cfg loaded -- F5 spawn Devron, F6 slay, F7 ents, F8 quest 33"
