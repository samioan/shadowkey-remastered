# M88 live repro: the quest log, end to end.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots (it
# skips the main menu, arms your hands, and can freeze the AI), and the
# symptoms read exactly like a code regression. The game now prints a
# loud banner when one is present; believe it.

# Somewhere with a real zone loaded, so `quests`/`inspect menu` run
# against the same state a play session has.
zone azra

# Take two quests the way a conversation would -- these go through the
# real SetQuestAssigned native, not a back door.
quest 0 assigned 1
quest 6 assigned 1

# Before: which ids the player has touched, each with its real title from
# the engine's own per-quest string table, and whether it reaches the log.
bind f5 quests

# Open the real questlog.s screen through the real native
# (player.OpenMenu is what charactermanager.s's Quest Log button reaches),
# then dump exactly what it built -- three rows per quest, the title
# centred, a blank separator, in id order.
bind f6 "call player OpenMenu questlog"
bind f7 "inspect menu"

# Close one out and dump again: completing a quest is what removes it,
# solving it is not.
bind f8 "quest 0 completed 1"
