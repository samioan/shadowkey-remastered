# M81: the loot-bag drop repro.
#
# `exec` runs a whole file inside one console drain, and two of these steps
# need a *later* tick than the one that queues them -- travelling to a zone
# takes effect in the zone-load block, and a creature's death is handled
# after the AI tick. So the sequence lives on function keys, one press per
# step, rather than as a straight run of commands.
#
#   copy this to autoexec.cfg (or `exec m81_loot` from the console), then:
#     F5  spawn a batch of rats in front of you
#     F6  kill every live creature in the zone
#     F7  list what is left standing -- the drops are the `container` rows
#         at the end, `model 30` (bag_dropped.bin)
#     F8  stand back from where they died
#     F9  look at it
#
# Before M81 F7 listed no new containers at all: every bag loaded as an
# empty, invisible, unusable object because the script path was built
# without its `.s`. See docs/PORT_ROADMAP.md's M81 entry.
zone azra
bind f5 "spawn arat 40 400"
bind f6 killall
bind f7 ents
bind f8 "tp 31400 14700"
bind f9 "face 180"
echo "m81_loot.cfg loaded -- F5 spawn, F6 killall, F7 ents, F8/F9 go look"
