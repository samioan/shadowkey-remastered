# M89 live repro: fog, the light bake, and the .zlu family.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots (it
# skips the main menu, arms your hands, and can freeze the AI), and the
# symptoms read exactly like a code regression. The game now prints a
# loud banner when one is present; believe it.

# The zone the report named. Its .zfg fades to 0x99b -- a pale daylight
# haze -- so distance here should wash *out*, not go black. Before M89
# this zone baked to a mean .zlu rung of 5.7 out of 63.
zone snowline

# Walk between the two ends of the fog ramp: the level is
# `depth * (0x10000 / (25 / 2)) >> 8 >> 12`, so it climbs one step every
# 0.75 tiles and saturates at twelve. Anything past twelve tiles is the
# fog colour, flat.
bind f5 "tpt 10 24"
bind f6 "tpt 20 30"

# azra fades to 0x000 instead: the same mechanism, the other end. Its
# family-2 cells (35 of them, around 124,42) are the ones that used to
# come out green -- they should now be indistinguishable from the wall
# beside them.
#
# NOTE: entering azra fires its tutorial popup chain, and those want
# **Key 5**, which is the one non-keyboard binding on the control sheet
# (pc_key_map.h: VK_LBUTTON, delivered through WM_LBUTTONDOWN) -- so a
# scripted WM_KEYDOWN driver cannot dismiss them and gets stuck on the
# first page. Click them away by hand, or skip the game entirely and use
# the offline renderer, which puts the camera on the same tiles with no
# game state at all:
#
#     port\build\render_at_smoke.exe 121 44 <yawDeg> out.ppm azra
bind f7 "zone azra"
bind f8 "tpt 121 44"
