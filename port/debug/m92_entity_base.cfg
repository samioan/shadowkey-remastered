# M92 live repro: the `0x14d08` Object/Entity base on every receiver --
# and, in particular, the one binding with visible consequences.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

# ---------------------------------------------------------------------
# 1. ShowEntity, on the set-piece that shows it best.
# ---------------------------------------------------------------------
# `stouttp.s`'s Init() ends with
#     GetEntity("trinket").ShowEntity(false);
# and Old Trinket's own script has a `ShowOG[]` handler -- ShowEntity(true),
# SetUsable(true), MirrorMethod("ShowOG") -- that the shopkeeper's
# conversation calls when she finally points him out.
#
# Before M92 all three soft-failed, so Old Trinket stood in the middle of
# the Stout Trapping Post from the moment the zone loaded, with a working
# Use prompt, and the reveal did nothing because there was nothing to
# reveal. He should now be absent on arrival.
zone stouttp

# `ents trinket` prints his row. The state column is the check:
#   hidden     -- ShowEntity(false) landed (M92, correct)
#   idle/npc   -- it did not
# `entinfo <index>` has the rest.
bind f5 "ents trinket"

# And the reveal, through the real native path -- the same call the
# conversation makes. `ents` first to get his index, then:
#   call ent:<n> ShowEntity true
# He appears where he has been standing all along, and his Use prompt
# comes back with SetUsable(true) when the real ShowOG handler runs:
#   sk ent:<n> ShowOG()
bind f6 "ents"

# ---------------------------------------------------------------------
# 2. GetID, which nothing could answer before.
# ---------------------------------------------------------------------
# Every placement's `.ent` name is now seeded onto its script object before
# Init(), which is what `GetID()` reads. `lakvan/sdoor_trapa.s` is the
# script that proves it matters: one script on four placements, told apart
# with `if (GetID() = "11s")` / `"gg5"` / `"sdoor1"` / `"hh6"`, each of
# which is a real name in lakvan.ent. Opening one used to set none of the
# four `Level.saved_OpenSDoorA..D` flags, because GetID() returned nothing.
#
#   zone lakvan
#   ents sdoor
#   call ent:<n> GetID
bind f7 "zone lakvan"

# ---------------------------------------------------------------------
# 3. SetPassable on a creature, and the pairing the corpus uses.
# ---------------------------------------------------------------------
# `dstar_w.s` and `fearfrst.s` both hide an NPC and make it walk-through in
# the same breath:
#     Porliss.ShowEntity(false);  Porliss.SetPassable(true);
# The second half soft-failed on a creature until M92 (12 lines in the
# suite), so a hidden NPC stayed a solid invisible wall. Walk into one:
#
#   zone dstar_w
#   ents porliss
#   call ent:<n> SetPassable true     -- you can now walk through
#   call ent:<n> SetPassable false    -- and are stopped again

# ---------------------------------------------------------------------
# 4. What to watch in shadowkey_port.log.
# ---------------------------------------------------------------------
# These three should no longer appear at all:
#   [soft-fail] Door: SetName(...)
#   [soft-fail] Monster: SetPassable(...)
#   [soft-fail] Item: PlaySound(...)
# nor any of ShowEntity / MirrorMethod / GetID / RunScript / SetModel /
# SetRotationTurn on any receiver. `softfails` lists what did.
#
# And a spell built from an upgraded variant prints its swap:
#   [entity] RunScript("Blaze") -- switched to .../blaze.s
# Try: give spells/u_blaze_lvl10.s
bind f8 "softfails 40"
