# M106 live repro: a popup row the script switched off stays off.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# `buysell.s` builds ONE popup and reuses it. All three rows are created
# with callbacks --
#     msgPopup.AddItem(3297,"CloseMsgPopup");  // 0
#     msgPopup.AddItem(3297,"ForcePurchase");  // 1
#     msgPopup.AddItem(3297,"CloseMsgPopup");  // 2
# -- and after a purchase rows 0 and 1 are overwritten with plain text
# ("You bought X" / "for N gold") and switched off with
# `SetSelectable(i,false)`. That call is the only thing making them inert.
#
# Until M106 this port ignored SetSelectable and derived "selectable" from
# "has a callback", so row 1 stayed live with `ForcePurchase` attached:
# moving up from OK onto the "for N gold" line and pressing Enter bought
# the item a second time and charged for it again.
#
# The check is gold. Buy one Muffin (2 gold), then aim at the message row
# and press Enter -- gold must not move.
#
# Dark Star West is used rather than azra because it has a real *placed*
# merchant: entities.txt row 180 is `dstar_w\Weapons_Merchant.s`, and the
# zone loads him at entity index 22. His own OnUse is what sets the
# merchant pointer -- `GetPlayer().SetMerchant(self)` -- so calling it is
# the same path walking up and talking to him takes.
#
#   F5   the merchant's OnUse: SetMerchant(self) + open his conversation
#   F6   BuyFromMerchant() -- the shop, the same call his "Buy" row makes
#   F7   gold -- read it before buying
#   F8   gold -- read it again after
#   F9   inv -- what actually arrived
#
#   Enter  buy the selected product / confirm
#   W / S  move the popup cursor (WASD is the D-pad, not the arrow keys)
zone dstar_w
set god 1
gold 5000
bind f5 "call ent:22 OnUse"
bind f6 "sk player BuyFromMerchant()"
bind f7 "gold"
bind f8 "gold"
bind f9 "inv"
bind f12 quit
echo "m106_popup_selectable.cfg loaded -- F5 merchant, F6 shop, F7/F8 gold, F9 inv"
