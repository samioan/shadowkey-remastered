# M99 live repro: the Options screen's language popup and the key
# configuration screen.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# Stays on the main menu (no `zone`). BACK UP dragonstar.set first: every
# Quit, QuitGame and the window closing now write it, so a language or a
# binding changed here is what the next launch starts with.
#
#   F5   open configkeys.s -- page 1 lists Move Forward .. Look Up
#        Enter on a row: "Current Definition:" and the key; Enter on
#        Redefine: the press-a-key screen. Press any keypad/d-pad key (E is
#        Key 3) to take it, Esc to cancel. Back on the page, pick the row
#        again to see the new key -- and the action that had it now has
#        the old one.
#   F6   open options.s
#   F7   options.s's own SetGerman handler: the screen redraws in German
#        and the popup title reads "Sprache: Deutsch"
#   F8   inspect menu -- the rows, into the log
#   F9   GetLanguageStr, into the log
bind f5 "call menu OpenMenu ConfigKeys"
bind f6 "call menu OpenMenu Options"
bind f7 "sk menu SetGerman();"
bind f8 "inspect menu"
bind f9 "call menu GetLanguageStr"
echo "m99_options.cfg loaded -- F5 key config, F6 options, F7 German, F8 rows, F9 language"
