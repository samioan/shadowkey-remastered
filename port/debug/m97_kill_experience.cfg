# M97 live repro: a kill pays the creature's experience.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# A spawn and a death each need a later tick than the one that queued them
# (see m81_loot.cfg), so every step is its own key.
#
#   F5   xp -- read experience; press it between every other step
#   F6   spawn three monsters/arat.s (SetExpWorth(40) each -- a spawned
#        creature keeps its script's worth, because SetZone's share, azra's
#        "52 creature(s) worth 38 each" in the log, is written once at load)
#   F7   killall arat -- unsourced, like a script's DoDamage, so F5 reads
#        what it read before. That is the engine's rule, not a miss.
#   F8   slay arat -- the same deaths with the player as the attacker: F5
#        reads 40 more per rat. Before M97 it read the same as before.
#   F9   a real fight. arat.s has no model, and melee picks its target from
#        the object-ID buffer, so an invisible creature cannot be hit at all
#        -- this spawns an Azra Rat (typeId 202, model 18) instead, far
#        enough ahead to sit in the crosshair column once the auto-aim
#        pitch has dipped. Hold the attack button (keypad 5 or the left
#        mouse button) until it dies, then F5: 40 more, through
#        FUN_100425bc's own source.
#   F10  a weapon for F9, first: an empty hand does not attack at all.
#        iron_warhammer.s (it reads back as "Iron Mace", 28 max) lands in
#        the empty hand by itself -- `equip` would need that name, not the
#        file's.
zone azra
set god 1
set freezeai 1
bind f5 xp
bind f6 "spawn arat 3 400"
bind f7 "killall arat"
bind f8 "slay arat"
bind f9 "spawn 202 1 450"
bind f10 "give weapons/iron_warhammer.s"
echo "m97_kill_experience.cfg loaded -- F5 xp, F6 spawn, F7 killall, F8 slay, F10 then F9 to fight"
