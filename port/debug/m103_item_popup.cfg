# M103 live repro: an item can say no, a bomb goes off, and using a quest
# item stops destroying it.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# `items/trothgars_magicka_potion.s` is the game's only DisplayPopup caller.
# Its OnUse refuses below 50 fatigue and says so in a popup on whatever
# screen you used it from -- so this one has to be driven from the real
# Inventory screen, not from the console: open Inventory, put the cursor on
# the potion, and Use it. Before M103 the refusal was silent AND ate the
# potion.
#
# `items/shadowkey2.s` is one of the eleven Shadowkey fragments. Its OnUse
# never calls DestroyObject, and neither do 48 other item scripts -- every
# castable spell among them. Using one from the Inventory screen used to
# delete it.
#
# `items/vermin_bomb.s` is CastAzraWrath: Random(2,12) to everything within
# 12000 units of the thrower, plus a separate Random(-2,-12) to the thrower.
# Spawn the rats first, then use the bomb from the Inventory screen and
# watch the log for the [azrawrath] line and the rats' health.
#
# The four items are given at startup. Tab opens the character manager;
# its Equip row opens the Inventory screen, where the Use action lives.
#
#   F5   call player SetFatigue 10 -- the potion will now refuse
#   F6   inv -- the rows, and the dagger's price and icon it never set
#   F7   call player SetFatigue 80 -- now the potion will work
#   F8   spawn three rats in front of you
#   F9   stats -- health, to read against the bomb's own bite
#   F10  give another potion, if one gets used up
zone azra
set god 0
give items/trothgars_magicka_potion.s
give items/shadowkey2.s
give items/vermin_bomb.s
give dagger.s
bind f5 "call player SetFatigue 10"
bind f6 "inv"
bind f7 "call player SetFatigue 80"
bind f8 "spawn monsters/azra_rat.s 3 500"
bind f9 "stats"
bind f10 "give items/trothgars_magicka_potion.s"
echo "m103_item_popup.cfg loaded -- F5 tired, F6 inv, F7 rested, F8 rats, F9 stats"
