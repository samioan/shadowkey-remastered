# M104 live repro: the herb rat's screen refuses the select key for three
# seconds, and the action queue knows which hand it is showing.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# entities.txt row 204 is `ratherb.s`, the Azra rat carrying the quest herb.
# Killing it runs an OnKilled that asks `Level.IsMultiplayer()` three times
# (all three used to soft-fail) and then opens `herbhurrah.s`, whose Init
# calls `DelayOnEnter()`. That screen is one button, and it appears the
# instant a fight ends -- while the player is still holding the key they
# were attacking with -- so the delay is what stops it being dismissed
# before it can be read.
#
#   F5   spawn the herb rat
#   F6   slay it by name -- `slay rat` would take all 37 in the zone, and
#        the eighth kill fires a *different* screen (rathurrah.s, from
#        ratherb.s's DelayReached arm), which is not the one to watch
#        ... now press Enter at once: nothing happens.
#        ... wait three seconds, press Enter again: the screen closes.
#   F7   call menu SetRightActionQueue -- pick the right hand
#   F8   call menu ShowActionQueue -- its title is now the right queue's
#   F9   inspect menu -- the rows, to read the title id off
zone azra
set god 1
give weapons/club.s
equip Club r
bind f5 "spawn 204 1 400"
bind f6 "slay assault"
bind f7 "call menu SetRightActionQueue"
bind f8 "call menu ShowActionQueue"
bind f9 "inspect menu"
echo "m104_delay_queue.cfg loaded -- F5 spawn, F6 slay, F7/F8 action queue, F9 inspect"
