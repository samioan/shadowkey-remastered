# M93 live repro: SetCanDrop, and the drop it guards.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

zone azra
give items/shadowkey1.s

# ---------------------------------------------------------------------
# Driving the real inventory screen from the console.
# ---------------------------------------------------------------------
# Press **Tab** first: that opens charactermanager.s for real, which is
# what makes `menu` (the `sk`/`call` receiver) resolve to something. From
# there these three are the real script handlers, in the order the screen
# itself calls them.
bind f5 "sk menu CMEquipScreen()"
bind f6 "sk menu ConsumablesMenu(0)"
bind f7 "sk menu MiscItemsMenu(0)"

# The drop. `SelectedInventoryItem[]` is the table callback that sets
# `activeInventoryItem` and rebuilds the action popup (it is also where
# `UpdatePopupItem(2, "")` blanks the Drop row for a quest item);
# `DropInventoryItem[]` is the Drop row itself; `ConfirmDrop[]` is Yes.
bind f8 "sk menu SelectedInventoryItem(); DropInventoryItem(); ConfirmDrop();"

bind f9 "inv"
bind f10 "ents container"

# ---------------------------------------------------------------------
# What to see.
# ---------------------------------------------------------------------
# **An ordinary item** (Tab, F5, F6, F8): the console prints
#
#     [drop] Bread -> loot bag at (30218, 11776)
#
# `inv` has lost it and `ents container` has gained one at that position,
# **model 30** (`bag_dropped.bin`) about 181 units away -- half a tile on
# each axis, which is 128*sqrt(2). Walk into it and Use: it is a real
# `Loot_Dropped` bag and the bread is inside, so a drop is recoverable.
# Before M93 the item was simply deleted.
#
# **A quest item** (Tab, F5, F7, F8): nothing happens at all. No `[drop]`
# line, no new container, and `inv` still lists Delfran's Shadowkey.
# Before M93 `CanDrop()` answered a hardcoded true, so all three of the
# game's guards passed and the Shadowkey could be thrown away.
#
# A stack behaves the way the engine's own case does: give yourself
# several of something (`give items/bread.s` repeatedly) and each drop
# takes exactly one off the pile and leaves a bag holding one.
