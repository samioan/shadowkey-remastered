# M94 live repro: the trap/magic-damage mixin and the two saving throws.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

# crypt1 is where the traps are: five locked doors, `door1`..`door5`, each
# a `lockeddoor_*.s` placement carrying a spell template and a level, and
# each registered as a trap trigger by crypt1.s's own Init().
zone crypt1

# `ents door` lists them. Note each name appears **twice**: once as the
# category-10 trap entity (typeId 27) the zone places, and once as the
# container this port loads the door script onto. The script object is the
# container one -- the lower index.
bind f5 "ents door"

# ---------------------------------------------------------------------
# 1. CanDisarmTrap, and the level gate.
# ---------------------------------------------------------------------
# Every shipped door declares `resistDisarm[5]`, and the real formula
# refuses outright when `level < resist / 2`. So a fresh level-1 character
# **cannot pick any lock in the game**, which is correct and is why F7
# answers false every time until F8 has run.
bind f7 "sk player CanDisarmTrap(5)"
bind f8 "call player SetLevel 5"

# At level 5 the roll is live: a Battlemage lands it about a third of the
# time, a Thief about two thirds (the non-Thief/Nightblade skill is
# halved). Try it after `call player ChooseCharacter 8` -- but note that
# ChooseCharacter resets the level to 1, so SetLevel again afterwards.
bind f9 "call player ChooseCharacter 8"

# ---------------------------------------------------------------------
# 2. The trap firing.
# ---------------------------------------------------------------------
# `MagicDamage[]` is what UsePicks.s calls when the roll fails, and it is
# `DoMagicDamage(...)` plus a "you were hurt" popup. Use the container
# index F5 printed for door1:
#
#   sk ent:<n> DoMagicDamage()
#
# The console prints
#
#     [trap] "door1" casts template 50 at level 10
#
# and `stats` shows health down -- 100 -> 77 in the session this was
# written from. Two things land at once and the real case runs both: the
# claiming trigger's own physical roll (crypt1.s gives door1
# `SetTrap(3, 23, 25)`) and the spell's `HitTarget`. door3 and door4 are
# `SetTrap(0, 0, 25)` -- no physical damage at all -- so firing on one of
# those isolates the spell.
bind f6 "stats"

# ---------------------------------------------------------------------
# 3. What the gate is.
# ---------------------------------------------------------------------
# DoMagicDamage only casts if a *trap trigger claims this entity by name*
# (`FUN_1007307c` -> `FUN_10090818`, matching `entity+0xcb`, which is the
# .ent placement name M92 wired up). Fire it on a door the zone has no
# trigger for and the console says so instead:
#
#     [trap] DoMagicDamage() on "..." -- no trap trigger claims it, nothing cast
#
# Every shipped caller is claimed, which is why that branch is a logged
# no-op here rather than the engine's re-entry into OnUse.
