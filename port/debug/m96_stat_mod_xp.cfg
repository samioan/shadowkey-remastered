# M96 live repro: StatModXP, the quest-reward experience.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

zone azra

# F6 first, to see where you start: experience, what the next level needs,
# and the level.
bind f6 "xp"

# F5 is almatheaconvo.s's reward, the same call the conversation makes.
# Before M96 the log said
#
#     [soft-fail] Player: StatModXP(1500) -- not implemented
#
# and F6 read the same experience as before. Now F6 reads 1500 more, and
# because a new character's first threshold is 900-1200 (by class), the
# level goes up with it -- one level, and one point on the level-up screen.
bind f5 "sk player StatModXP(1500)"

# F7 is pilgrim_convo.s's 2250. Press it twice from a fresh character and
# the level still rises once per press, never twice, however far past the
# next threshold the total lands (FUN_1004a104 tests once per call).
bind f7 "sk player StatModXP(2250)"

# To spend the point: Tab, then the character manager's level-up row.
