# M102 live repro: a script's WalkTo really walks a creature, and the highway
# mage's AddInventoryItem stops soft-failing.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# Devron (monsters/devron.s) is non-aggressive, so nothing else drives him:
# the walk order is the only thing moving him. `ents devron` prints his index
# and position; F7's WalkTo names a spot a few tiles north, and each later
# `ents` should show him closer to it and then standing on it -- the engine
# has no arrival test, so he stops only because he is there.
#
# entities.txt row 179 is lakvan's Highway Mage, the one script in the game
# that calls AddInventoryItem; spawning it used to print a soft-fail line.
#
#   F5   spawn Devron
#   F6   ents devron -- his index and position
#   F7   call ent:68 WalkTo 29000 11440
#   F8   ents devron -- closer
#   F9   ents devron -- there
#   F10  spawn the highway mage -- no soft-fail line
zone azra
set god 1
bind f5 "spawn monsters/devron.s 1 600"
bind f6 "ents devron"
bind f7 "call ent:68 WalkTo 29000 11440"
bind f8 "ents devron"
bind f9 "ents devron"
bind f10 "spawn 179 1 600"
echo "m102_walkto.cfg loaded -- F5 spawn, F6 ents, F7 WalkTo, F8/F9 ents, F10 highway mage"
