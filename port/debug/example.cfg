# Example console script. Copy to autoexec.cfg to have it run at startup.
#
# This one sets up the M67 door repro: stand in azra's first room with the
# tile grid on screen, so the block bit under and around you is visible
# while you open the door.

# Overlay: the world page, which includes the 9x9 tile block grid.
set tilegrid 1
page world

# Handy shortcuts on the free function keys.
bind f5 "tile"
bind f6 "ents door"
bind f7 "set noclip"
bind f8 "diff"

# Watch the block bit of the tile you are standing on, every frame.
watch tile

# Uncomment to travel straight there on launch, skipping the menus.
# (Only works once a character exists -- from the main menu, start a game
#  first, then `exec` this.)
# zone azra

echo "example.cfg loaded -- F5 tile, F6 doors, F7 noclip, F8 diff"
