# M101 live repro: a shadow door leaves the world, and the player can die.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# twilite's `sdwdoor` is the shadow-key door `twilite/shadow_open.s` opens with
# `Door.DestroyObjectMirror(Door)`, which used to soft-fail on a door. `ents
# sdwdoor` prints its index; `call ent:<n> DestroyObjectMirror` is that same
# call with no argument (this entity). The index below is the one this build
# prints -- if the zone's entity order ever changes, read it off F5 again.
#
#   F5   ents sdwdoor -- "solid"
#   F6   call ent:<n> DestroyObjectMirror -- the door leaves the world
#   F7   ents sdwdoor -- "removed"; walk through where it stood
#   F8   call player SetInvulnerable true -- God Mode
#   F9   call player DoDamage 9999 -- health 0, no death screen
#   F10  call player SetInvulnerable false
#   F11  call player DoDamage 9999 -- DeathMenu; its back key quits to the menu
zone twilite
bind f5 "ents sdwdoor"
bind f6 "call ent:64 DestroyObjectMirror"
bind f7 "ents sdwdoor"
bind f8 "call player SetInvulnerable true"
bind f9 "call player DoDamage 9999"
bind f10 "call player SetInvulnerable false"
bind f11 "call player DoDamage 9999"
echo "m101_destroy_death.cfg loaded -- F5 ents, F6 destroy door, F7 ents, F8 god, F9 hit, F10 mortal, F11 hit"
