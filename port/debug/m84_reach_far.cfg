# M84/M85 -- the negative half of m84_reach.cfg: a creature parked
# OUTSIDE the real melee reach cannot be hit however long you swing.
#
# 2400 units is past `FUN_100425bc`'s own `< 0x76c` (1900), and
# `freezeai` is on so the target cannot simply walk into range and
# make the result ambiguous. `combat.swings` should climb while
# `combat.hits_by_player` stays put.
#
#   F5 spawn at 2400, F6 mark, swing, F7 diff, F8 ents
zone azra
set god 1
set freezeai 1
equip Club r
bind f5 "spawn 106 1 2400"
bind f6 mark
bind f7 diff
bind f8 ents
