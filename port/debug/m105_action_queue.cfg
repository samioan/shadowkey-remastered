# M105 live repro: the action queue screen shows what is actually in the
# queue, and its Up/Down really reorder it.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# `actionqueue.s` builds five `AddFloatingText("item", ...)` rows and then
# calls `UpdateTextItems()`, which is what replaces those placeholders with
# the real contents of one hand's queue. Until M105 this port had no queue
# at all, so the screen showed five rows reading "item" and its
# Drop/Up/Down popup had nothing to act on.
#
# Picking a weapon up appends it to that hand's queue -- but only when it
# actually equips, because the engine's pickup tail (FUN_1003d8e0) returns
# before the queue Add if the hand is already full. So the second and third
# weapon go in the way the player would put them there: through the Equip
# row, which toggles queue membership (FUN_10033660 case 1). `equip` on the
# console is that same UpdateEquipStatus call.
#
#   Tab              character manager
#   F5               equip the other two into the queue
#   F6               call menu SetRightActionQueue
#   F7               call menu ShowActionQueue -- three real weapon names
#   F8               inspect menu -- the rows, with their text
#   F9               inv -- the same three weapons, still in the bag
zone azra
set god 1
give weapons/iron_dagger.s
give weapons/steel_dagger.s
give weapons/iron_shortsword.s
bind f5 "equip Steel r"
bind f6 "call menu SetRightActionQueue"
bind f7 "call menu ShowActionQueue"
bind f8 "inspect menu"
bind f9 "inv"
bind f10 "equip Shortsword r"
echo "m105_action_queue.cfg loaded -- F5/F10 queue two more, F6/F7 open, F8 inspect"
