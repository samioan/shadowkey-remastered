# M91 live repro: the in-game main menu, saving/loading, and the menu rows
# that never fired.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots (it
# skips the main menu, arms your hands, and can freeze the AI), and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.

# ---------------------------------------------------------------------
# 1. The in-game main menu (Esc).
# ---------------------------------------------------------------------
# `zone` starts a session without going through character creation, which
# is all GameActive() needs to answer true. Press **Esc** and the front
# end's rows should be gone: Return To Game / Load Game / Save Game /
# Delete Saved Game / Options / End Game, opening on Return To Game.
#
# Before M91 this was the *title* menu -- New Game, Multiplayer, Credits,
# Quit Game -- because GameActive() was hardcoded false and nothing had
# re-run mainmenu.s's OnDisplay since boot.
zone ghstpass

# Walk a little before saving, so "did the load put me back?" has an
# answer that is not the zone's own start record. F5 prints where you are;
# write it down, save, quit to the title screen, load, press F5 again.
bind f5 "where"

# ---------------------------------------------------------------------
# 2. Save and load.
# ---------------------------------------------------------------------
# Esc -> Save Game -> a slot -> "Game Saved." -> **OK**. That OK row is
# `AddItem(4028,"CancelDoneSave")` on a popup whose `SetSelectedItem(1)`
# is 0-based, so the popup opens *on* it; pre-M91 the highlight sat on the
# message line above and Enter did nothing at all, which is what "I can't
# close it" was.
#
# Then End Game -> Yes -> No, which tears the session down and returns to
# the front end. Load Game from there and F5 should print the position and
# heading you wrote down.
#
# Saves land next to the executable, as game0<slot>.sav:
#   port/build/game00.sav .. game03.sav
# Delete them to get back to a clean "Empty Slot" state.

# ---------------------------------------------------------------------
# 3. The "leave town" prompt (azra), and rows wired to a bare native.
# ---------------------------------------------------------------------
# Switch to azra (`zone azra`), dismiss the tutorial chain with **Key 5**
# (the left mouse button -- it is the one non-keyboard binding on the
# control sheet, so a scripted WM_KEYDOWN driver cannot answer it), then
# F6 teleports into one of azra's four "YouSure" regions. Both answers on
# that screen are `AddMenuItem(id, "Quit")` -- the native named directly
# in the callback slot -- and before M91 neither did anything, because the
# port only ever looked for a *script* method of that name. 290 shipped
# call sites name `Quit` this way.
#
# The region coordinates below are azra.zon's own, with the Y flip applied
# (`.zon` stores y as `gridHeight - y`; azra is 128 tall). The region walk
# only runs on a tick the player actually moved, and a `tpt` counts.
bind f6 "tpt 101 48"
bind f7 "tpt 96 42"

# The other bare-`Quit` screen in azra, for comparison -- ohnoskelos.s,
# reached from the Skelos_Dead region once that quest flag is set.
bind f8 "tpt 108 103"

# What to watch in the log:
#   [MenuStack] saved to slot N ... / loaded slot N -- "...", level "...",
#   at (x,y,z) heading h
# and, for a row wired to a name that is neither a script handler nor a
# native (the corpus's genuinely dead ones -- MenuQuit, MenuBack,
# ExitMenu):
#   [soft-fail] Menu: MenuQuit() -- not implemented
