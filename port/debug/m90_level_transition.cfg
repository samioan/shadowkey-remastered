# M90 live repro: the travel prompt, and the bare LoadLevel.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots (it
# skips the main menu, arms your hands, and can freeze the AI), and the
# symptoms read exactly like a code regression. The game now prints a
# loud banner when one is present; believe it.

# ghstpass is the zone with one doorway of each spelling. Its own .zon
# names them; the tile coordinates below are the region centres, read
# straight out of ghstpass.zon **with the Y flip applied** (`.zon` stores
# y as `gridHeight - y`, see world/zone.cpp's parse loop -- take the raw
# numbers and you land on the far side of the map).
#
# The region walk only runs on a tick the player actually moved (M83), so
# take a step after each teleport or nothing fires.
zone ghstpass

# The bare one. ghstpass.s's EnterZone("BrokenWing") is
#     LoadLevel("broken1");
#     GetPlayer().SetCameraStart( 16768, 1388, -1024, 0, 0, 0 );
# and before M90 the first line logged
#     [soft-fail] ZoneScript: LoadLevel(broken1) -- not implemented
# so this doorway did nothing at all. It should now stop you and ask,
# "Travel to: / Broken Wing I / No / Yes".
#
# Say **No** first: you should still be standing in ghstpass, with the
# level name unchanged. `inspect zone` confirms it. Then walk back in and
# say Yes.
bind f5 "tpt 32 27"

# The qualified one, three regions away in the same zone --
# EnterZone("Azra") is `LoadLevel("azra")`, also bare here. ghstpass
# reaches azra, twilite, snowline, broken1 and stouttp; every one of the
# five is a prompt now.
bind f6 "tpt 62 12"
bind f7 "tpt 119 20"

# The other side of the first doorway: azra's own "ghasts" region, which
# is `Level.LoadLevel("GhstPass")` -- the spelling that used to teleport
# with no prompt at all. Same screen, reading "Ghast's Pass".
#
# NOTE: entering azra fires its tutorial popup chain, and those want
# **Key 5**, which is the one non-keyboard binding on the control sheet
# (pc_key_map.h: VK_LBUTTON, delivered through WM_LBUTTONDOWN) -- so a
# scripted WM_KEYDOWN driver cannot dismiss them. Click them away by
# hand.
bind f8 "zone azra"
bind f9 "tpt 61 118"

# What to watch in the log:
#   [zone] LoadLevel("broken1") -- travel prompt (from "ghstpass")
# and, on No, nothing after it. On Yes, the real loading screen banner
# ("Travel to: Broken Wing I") and then the zone-load trace.
