# M84-M87: enemy size, melee reach, damage and the two hit feedbacks.
#
# The report was one sentence about size and one about damage, and both
# come out of the same swing. The reach this port used to allow was the
# weapon's own SetRange(), 384 units, inside a 60-degree cone. The real
# one (FUN_100425bc) picks its target out of the object-ID buffer at five
# fixed screen points down the crosshair column and accepts anything
# closer than 0x76c == 1900 units. That is the number this file exercises.
#
#   copy this to autoexec.cfg (or `exec m84_reach` from the console), then:
#     F5  spawn one brawler at 900 units -- more than twice the old reach
#         (the Club is put in your right hand by the header above)
#     F6  snapshot the counters
#     F7  show what moved -- combat.hits_by_player is the one that matters
#     F8  list everything, with health, if you want to read it that way
#     F9  spawn one at 2400, outside even the real reach
#    F10  where you are, for checking a distance by hand
#
# Between F6 and F7: close the console and hold the attack key (keypad 5 /
# left mouse). Aim matters -- the pick is whatever is drawn under the
# middle of the screen, not the nearest thing in a cone -- and a creature
# behind a wall cannot be hit at all, because it never reaches the buffer.
#
# `god` is on so a fight at melee range cannot end the session early;
# turn it off (`set god 0`) to see the other half of M86.
#
# What to look for:
#   * `combat.hits_by_player` moves at all. Before M85 nothing past 384
#     units could be touched, and the brawler spawns at 900.
#   * the one at 2400 cannot be hit however long you swing at it.
#   * a creature you hit turns red for about a third of a second (M86,
#     the FUN_10067c3c ramp through the engine+0x5060 table).
#   * with god off, when one hits back a red diagonal slash blends over
#     the whole view for a quarter of a second (M86, global.spr slot 218).
#
# **Spawn by typeId, not by script name.** entities.txt row 106 is the
# Bandit Brawler, model 22 -- and the model is now load-bearing. `spawn
# bbrawler.s` builds a creature that is not in entities.txt, so it has no
# model, so it is never drawn, so it never stamps the object-ID buffer and
# the melee search cannot find it. Before M85 an invisible creature could
# still be hit, because the old cone test only knew about positions. Being
# unable to hit what is not drawn is the correct new behaviour, and this
# line is here so nobody rediscovers it as a bug.
zone azra
set god 1
# The starting kit lands in the inventory but not in a hand:
# LoadStartingInventory pushes straight into m_Inventory and never goes
# through AddItem, which is where M74 put the real "picking something up
# equips it" tail. A console-started session therefore has empty hands,
# and `FUN_10042394` does nothing at all for an empty hand (M78) -- so
# without this line there is no swing to measure. A real New Game is
# unaffected; this is only the console's shortcut showing.
equip Club r
bind f5 "spawn 106 1 900"
bind f6 mark
bind f7 diff
bind f8 ents
bind f9 "spawn 106 1 2400"
bind f10 where
echo "m84_reach.cfg loaded -- F5 spawn@900, F6 mark, swing, F7 diff, F8 ents, F9 spawn@2400, F10 where"
