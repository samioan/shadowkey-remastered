# M98 live repro: the attacker's Strength lands on every hit.
#
# Copy to autoexec.cfg to have it run at startup -- and DELETE IT
# AFTERWARDS. A leftover autoexec.cfg rewrites how the game boots and the
# symptoms read exactly like a code regression. The game prints a loud
# banner when one is present; believe it.
#
# FUN_10049e78 adds (Strength + StrengthBonus) / 5 to every hit from an
# attacker whose Strength is above 4. The Iron Mace rolls at most 28, and an
# Azra Rat has 23 health, so `combat.damage_dealt` -- what actually came off
# health, per connecting swing -- tells the two apart at a glance:
#
#   F10  give the mace first: an empty hand does not attack at all
#   F6   stat str 4 -- no term; a kill adds at most 28 to damage_dealt
#   F9   spawn an Azra Rat (typeId 202) into the crosshair column; hold the
#        attack button (keypad 5 or the left mouse button) until it dies
#   F5   metrics combat -- read hits_by_player and damage_dealt
#   F7   stat str 1000 -- a term of 200: the next connecting swing adds
#        200 or more to damage_dealt on its own. Before M98 it could not
#        exceed 28 whatever the Strength.
#   F9   another rat, hold attack until it dies, F5 again
zone azra
set god 1
set freezeai 1
bind f5 "metrics combat"
bind f6 "stat str 4"
bind f7 "stat str 1000"
bind f9 "spawn 202 1 450"
bind f10 "give weapons/iron_warhammer.s"
echo "m98_attacker_terms.cfg loaded -- F10 mace, F6/F7 strength, F9 rat, F5 metrics"
